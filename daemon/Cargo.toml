[package]
name = "ami_daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["ws"] }
env_logger = "0.11.10"
futures-util = "0.3.32"
log = "0.4.29"
mpris-server = "0.9.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
ami_core = { path = "../core" }
tokio = { version = "1.50.0", features = ["full", "rt-multi-thread"] }
rodio = { git = "https://github.com/RustAudio/rodio.git", features = ["symphonia-libopus"] }
fern = "0.7.1"
humantime = "2.3.0"
url = { version = "2.5.8", features = ["serde"] }
tower-http = { version = "0.6.8", features = ["fs"] }
libc = "0.2.186"
local-ip-address = "0.6.13"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
ts-rs = "12.0.1"
